<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>X-/ CORE</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #0ff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .xbox {
      border: 1px solid #0ff;
      padding: 20px;
      width: 260px;
      text-align: center;
      box-shadow: 0 0 12px #0ff;
    }
    button {
      background: #000;
      color: #0ff;
      border: 1px solid #0ff;
      padding: 6px 12px;
      margin: 6px;
      cursor: pointer;
    }
    #state {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="xbox">
    <div>X-/ CORE</div>
    <button id="m4">4ME</button>
    <button id="a4">4ALL</button>
    <div id="state">SPECTRUM: waiting…</div>
  </div>

  <script>
    function xSwitch(mode) {
      document.getElementById("state").textContent =
        "SPECTRUM: " + mode + " ACTIVE";
    }

    document.getElementById("m4").onclick = () => xSwitch("4ME");
    document.getElementById("a4").onclick = () => xSwitch("4ALL");
  </script>

</body>
</html>
